<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cờ Vua - Chess Game</title>
    <link rel="stylesheet" href="styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Roboto:wght@300;400;500&display=swap"
        rel="stylesheet">
    <!-- PeerJS for P2P Connection -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <h1 class="title">♔ Chess Master ♚</h1>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Left Panel - Online & Captured -->
            <aside class="side-panel left-panel">
                <!-- Online Controls -->
                <div id="online-panel" class="online-panel">
                    <h3>🌐 Chơi Online</h3>
                    <div class="online-controls">
                        <button id="create-room-btn" class="btn btn-online">
                            <span class="btn-icon">🏠</span> Tạo phòng
                        </button>
                        <div class="join-room">
                            <input type="text" id="room-code-input" placeholder="Mã phòng" maxlength="6">
                            <button id="join-room-btn" class="btn btn-join">Vào</button>
                        </div>
                    </div>
                    <div id="online-status" class="online-status"></div>
                    <div id="player-info-panel" class="player-info" style="display: none;">
                        <div>👤 <span id="player-name"></span> <span id="player-color"></span></div>
                        <div>🎯 vs <span id="opponent-name">-</span></div>
                    </div>
                </div>

                <!-- Captured Pieces White -->
                <div class="captured-section">
                    <h3>⚪ Quân trắng bị bắt</h3>
                    <div id="captured-white" class="captured-pieces"></div>
                </div>

                <!-- Captured Pieces Black -->
                <div class="captured-section">
                    <h3>⚫ Quân đen bị bắt</h3>
                    <div id="captured-black" class="captured-pieces"></div>
                </div>

                <!-- Turn Indicator -->
                <div class="turn-indicator" id="turn-indicator">
                    <span class="turn-dot white-turn"></span>
                    <span>Lượt: Trắng</span>
                </div>
            </aside>

            <!-- Chess Board -->
            <div class="board-container">
                <div class="board-wrapper">
                    <div class="board-labels row-labels">
                        <span>8</span><span>7</span><span>6</span><span>5</span>
                        <span>4</span><span>3</span><span>2</span><span>1</span>
                    </div>
                    <div id="chessboard" class="chessboard"></div>
                </div>
                <div class="board-labels col-labels">
                    <span>a</span><span>b</span><span>c</span><span>d</span>
                    <span>e</span><span>f</span><span>g</span><span>h</span>
                </div>
            </div>

            <!-- Right Panel - Controls -->
            <aside class="side-panel right-panel">
                <!-- Game Controls -->
                <div class="controls">
                    <button id="new-game-btn" class="btn btn-primary">
                        <span class="btn-icon">🔄</span> Ván mới
                    </button>
                    <button id="undo-btn" class="btn btn-secondary">
                        <span class="btn-icon">↩️</span> Hoàn tác
                    </button>
                    <button id="history-btn" class="btn btn-secondary">
                        <span class="btn-icon">📜</span> Lịch sử
                    </button>

                    <div class="ai-controls">
                        <label>🤖 Độ khó AI:</label>
                        <select id="ai-difficulty">
                            <option value="0">Chơi 2 người</option>
                            <option value="2">Dễ</option>
                            <option value="4" selected>Trung bình</option>
                            <option value="6">Khó</option>
                        </select>
                    </div>

                    <button id="play-ai-btn" class="btn btn-accent">
                        <span class="btn-icon">🤖</span> Chơi với AI
                    </button>

                    <div class="game-controls">
                        <label>🎮 Loại cờ:</label>
                        <select id="game-type-selector">
                            <option value="chess">♟️ Cờ Vua</option>
                            <option value="xiangqi">🧝 Cờ Tướng</option>
                            <option value="xo">⭕ Cờ XO (Caro)</option>
                        </select>
                    </div>

                    <div class="theme-controls">
                        <label>🎨 Giao diện:</label>
                        <select id="theme-selector">
                            <option value="harry-potter">⚡ Harry Potter</option>
                            <option value="greek">🏛️ Hy Lạp Cổ Đại</option>
                            <option value="cyber">🤖 Cyber Tech</option>
                            <option value="vampire">🧛 Ma Cà Rồng</option>
                        </select>
                    </div>
                </div>

                <!-- Chat Panel (only shows when connected) -->
                <div id="chat-panel" class="chat-panel">
                    <h3>💬 Chat</h3>
                    <div id="chat-messages" class="chat-messages"></div>
                    <div class="chat-input-container">
                        <input type="text" id="chat-input" placeholder="Nhập tin nhắn..." maxlength="200">
                        <button id="chat-send-btn" class="btn-send">➤</button>
                    </div>
                </div>
            </aside>
        </main>

        <!-- Flying Bats Container (for Vampire theme) -->
        <div id="bats-container" class="bats-container"></div>

        <!-- Blood Splash Container -->
        <div id="blood-container" class="blood-container"></div>

        <!-- Status Bar -->
        <div id="status-bar" class="status-bar">
            <span id="game-status">Sẵn sàng bắt đầu!</span>
        </div>

        <!-- Promotion Modal -->
        <div id="promotion-modal" class="modal">
            <div class="modal-content">
                <h2>Chọn quân phong cấp</h2>
                <div class="promotion-pieces" id="promotion-pieces"></div>
            </div>
        </div>

        <!-- Game Over Modal -->
        <div id="game-over-modal" class="modal">
            <div class="modal-content game-over-content">
                <h2 id="game-over-title">Kết thúc!</h2>
                <p id="game-over-message"></p>
                <button id="play-again-btn" class="btn btn-primary">Chơi lại</button>
            </div>
        </div>

        <!-- Share Link Modal -->
        <div id="share-modal" class="modal">
            <div class="modal-content share-content">
                <h2>📤 Chia sẻ phòng</h2>
                <p>Gửi link hoặc mã phòng cho bạn bè:</p>
                <div class="room-code-display">
                    <span id="room-code-text"></span>
                    <button id="copy-code-btn" class="btn btn-small">📋</button>
                </div>
                <div class="share-link-container">
                    <input type="text" id="share-link" readonly>
                    <button id="copy-link-btn" class="btn btn-primary">📋 Copy Link</button>
                </div>
                <p class="share-waiting">⏳ Đang chờ đối thủ kết nối...</p>
                <button id="close-share-btn" class="btn btn-secondary">Đóng</button>
            </div>
        </div>

        <!-- History Modal -->
        <div id="history-modal" class="modal">
            <div class="modal-content history-content">
                <h2>📜 Lịch sử ván đấu</h2>
                <div id="history-list" class="history-list"></div>
                <div class="history-modal-actions">
                    <button id="clear-history-btn" class="btn btn-danger">🗑️ Xóa tất cả</button>
                    <button id="close-history-btn" class="btn btn-secondary">Đóng</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/pieces.js"></script>
    <script src="js/moves.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/game.js"></script>
    <script src="js/online.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/history.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/xiangqi.js"></script>
    <script src="js/xo.js"></script>
    <script src="js/manager.js"></script>

    <script>
        // Initialize online features
        document.addEventListener('DOMContentLoaded', () => {
            // Wait for game to initialize
            setTimeout(() => {
                if (window.chessGame) {
                    // Initialize Online Manager
                    window.onlineManager = new OnlineManager(window.chessGame);

                    // Initialize Chat Manager
                    window.chatManager = new ChatManager(window.onlineManager);
                    window.onlineManager.chatManager = window.chatManager;

                    // Initialize Game History
                    window.gameHistory = new GameHistory();

                    // Create Room Button
                    document.getElementById('create-room-btn').addEventListener('click', () => {
                        const name = prompt('Nhập tên của bạn:', 'Player 1');
                        if (name) {
                            window.onlineManager.createRoom(name);
                        }
                    });

                    // Join Room Button
                    document.getElementById('join-room-btn').addEventListener('click', () => {
                        const roomCode = document.getElementById('room-code-input').value.trim().toUpperCase();
                        if (roomCode.length === 6) {
                            const name = prompt('Nhập tên của bạn:', 'Player 2');
                            if (name) {
                                window.onlineManager.joinRoom(roomCode, name);
                            }
                        } else {
                            alert('Mã phòng phải có 6 ký tự!');
                        }
                    });

                    // Copy Link Button
                    document.getElementById('copy-link-btn').addEventListener('click', () => {
                        const linkInput = document.getElementById('share-link');
                        navigator.clipboard.writeText(linkInput.value).then(() => {
                            alert('Đã copy link!');
                        });
                    });

                    // Copy Code Button
                    document.getElementById('copy-code-btn')?.addEventListener('click', () => {
                        const code = document.getElementById('room-code-text').textContent;
                        navigator.clipboard.writeText(code).then(() => {
                            alert('Đã copy mã phòng: ' + code);
                        });
                    });

                    // Close Share Modal
                    document.getElementById('close-share-btn').addEventListener('click', () => {
                        document.getElementById('share-modal').classList.remove('show');
                    });

                    // History Button
                    document.getElementById('history-btn').addEventListener('click', () => {
                        window.gameHistory.renderHistoryModal();
                        document.getElementById('history-modal').classList.add('show');
                    });

                    // Close History Modal
                    document.getElementById('close-history-btn').addEventListener('click', () => {
                        document.getElementById('history-modal').classList.remove('show');
                    });

                    // Clear History Button
                    document.getElementById('clear-history-btn').addEventListener('click', () => {
                        if (confirm('Xóa tất cả lịch sử ván đấu?')) {
                            window.gameHistory.clearHistory();
                            window.gameHistory.renderHistoryModal();
                        }
                    });
                }
            }, 100);
        });
    </script>
</body>

</html>
